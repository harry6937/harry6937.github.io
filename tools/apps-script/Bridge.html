<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 云端连接</title><style>body{background:#f5f9f6;font:15px/1.8 system-ui,sans-serif;color:#214333;margin:0;padding:25px}main{max-width:440px;margin:10vh auto;background:white;padding:30px;border-radius:20px;border:1px solid #e1ebe4}.logo{display:inline-grid;place-items:center;width:48px;height:48px;background:#087f5b;color:white;border-radius:12px;font-size:22px;font-weight:bold}h1{font-size:23px}p{color:#6c8071}a{color:#087f5b}</style></head><body><main><div class="logo">M2</div><h1>工具中心 · 云端连接</h1><p id="state">正在连接工具中心…</p><p>此窗口仅连接你的私有工具清单。连接成功后返回工具中心操作，并保留这个窗口。</p><a href="https://harry6937.github.io/tools/" target="_blank" rel="noopener noreferrer">打开工具中心 ↗</a></main><script>
(()=>{'use strict';const config=__BRIDGE_CONFIG__;let host;try{host=config.mode==='popup'?window.top.opener:window.top}catch{}if(!host||host===window||!config.channel){document.getElementById('state').textContent='请从工具中心点击“连接 Google 云端”打开。';return}
const reply=payload=>host.postMessage({namespace:'m2-hub',channel:config.channel,...payload},config.origin);let connected=false;const inflight=new Set();const announce=()=>{if(!connected)reply({type:'ready'})};const timer=setInterval(announce,1000);
window.addEventListener('message',event=>{const m=event.data;if(event.origin!==config.origin||event.source!==host||!m||m.namespace!=='m2-hub'||m.channel!==config.channel)return;if(m.type==='ack'){connected=true;clearInterval(timer);document.getElementById('state').textContent='已连接。请返回工具中心，保留本窗口。';return}if(!connected||m.type!=='request'||!/^[-a-f0-9]{36}$/.test(m.id)||inflight.has(m.id)||!['read','save'].includes(m.method))return;inflight.add(m.id);const done=value=>{inflight.delete(m.id);reply({type:'result',id:m.id,...value})};const runner=google.script.run.withSuccessHandler(result=>done({result})).withFailureHandler(err=>done({error:err.message||'Google 同步未完成'}));if(m.method==='read')runner.hubRead();else runner.hubSave(m.payload)});announce();})();
</script></body></html>
